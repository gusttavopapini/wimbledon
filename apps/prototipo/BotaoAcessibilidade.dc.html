<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- Botão "Acessibilidade" reutilizável (canto superior direito das telas principais).
     Uso: <dc-import name="BotaoAcessibilidade" onClick="{{ a11y.onPanel }}"></dc-import>
     Abre a janela de opções de acessibilidade. Ícone + texto, área de toque ≥ 48×48px. -->
<button type="button" onClick="{{ onClick }}" aria-label="Abrir opções de acessibilidade" style="display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;min-width:48px;padding:0 16px 0 12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.95);background:rgba(255,255,255,.14);color:#ffffff;font:600 calc(15px*var(--fs,1))/1.2 var(--font-family);white-space:nowrap;cursor:pointer">
  <span aria-hidden="true" style="display:flex"><x-import component-from-global-scope="SaDeNaPalmaDaMODesignSystem_077ed4.Icon" name="accessibility" size="{{ 22 }}" color="#ffffff" hint-size="22px,22px"></x-import></span>Acessibilidade
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;180px&quot;,&quot;height&quot;:&quot;48px&quot;}}">
class Component extends DCLogic {
  renderVals() { return { onClick: this.props.onClick }; }
}
</script>
</body>
</html>
