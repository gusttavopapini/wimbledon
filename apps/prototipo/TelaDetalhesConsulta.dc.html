<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- Tela "consulta" do app Saúde na Palma da Mão.
     Recebe o view-model inteiro via prop "vm" (montado em spm-view.js). -->
  <div data-screen-label="12 Detalhes da consulta" style="display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;gap:14px;align-items:center">
      <dc-import name="SpecialtyIcon" src="{{ ap.img }}" size="md" hint-size="56px,56px"></dc-import>
      <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start">
        <h1 style="margin:0;font:700 calc(22px*var(--fs,1))/calc(30px*var(--fs,1)) var(--font-family);color:var(--teal-600)">{{ ap.name }}</h1>
        <span style="font:400 calc(17px*var(--fs,1))/calc(24px*var(--fs,1)) var(--font-family)">{{ ap.spec }}</span>
        <x-import component-from-global-scope="SaDeNaPalmaDaMODesignSystem_077ed4.StatusBadge" status="agendado" label="Agendada" hint-size="110px,32px"></x-import>
      </div>
    </div>
    <sc-if value="{{ ap.isToday }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ ap.onTrack }}" style="display:flex;gap:12px;align-items:center;padding:14px 16px;min-height:56px;border:0;border-radius:14px;background:var(--success-bg);color:var(--ink);cursor:pointer;text-align:left">
        <x-import component-from-global-scope="SaDeNaPalmaDaMODesignSystem_077ed4.Icon" name="activity" color="var(--success)" hint-size="24px,24px"></x-import>
        <span style="flex:1;display:flex;flex-direction:column"><span style="font:700 calc(17px*var(--fs,1))/calc(24px*var(--fs,1)) var(--font-family)">Consulta hoje</span><span style="font:400 calc(15px*var(--fs,1))/calc(22px*var(--fs,1)) var(--font-family)">Acompanhar atendimento · {{ ap.stageTxt }}</span></span>
        <x-import component-from-global-scope="SaDeNaPalmaDaMODesignSystem_077ed4.Icon" name="chevron-right" color="var(--success)" hint-size="24px,24px"></x-import>
      </button>
    </sc-if>
    <section style="border:1px solid var(--border-subtle);border-radius:16px;box-shadow:0 1px 3px rgba(3,117,127,.06);padding:16px;display:flex;flex-direction:column;gap:12px">
      <sc-for list="{{ ap.rows }}" as="r" hint-placeholder-count="6">
        <div style="display:flex;gap:12px;align-items:flex-start">
          <x-import component-from-global-scope="SaDeNaPalmaDaMODesignSystem_077ed4.Icon" name="{{ r.icon }}" hint-size="24px,24px"></x-import>
          <div style="display:flex;flex-direction:column;min-width:0"><span style="font:400 calc(14px*var(--fs,1))/calc(20px*var(--fs,1)) var(--font-family);color:var(--ink-muted)">{{ r.label }}</span><span style="font:500 calc(17px*var(--fs,1))/calc(24px*var(--fs,1)) var(--font-family)">{{ r.value }}</span></div>
        </div>
      </sc-for>
      <div style="position:relative;height:120px;border-radius:10px;overflow:hidden;background:var(--surface-2)">
        <svg viewBox="0 0 300 120" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"><path d="M0 70 L300 56" stroke="#fff" stroke-width="9"></path><path d="M160 0 L140 120" stroke="#fff" stroke-width="7"></path><path d="M-10 30 C 80 50, 160 10, 310 30" stroke="#cfe3e6" stroke-width="12" fill="none"></path><rect x="30" y="80" width="60" height="26" rx="4" fill="#dcebdc"></rect></svg>
        <span style="position:absolute;left:48%;top:52%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:var(--teal-600);border:2px solid var(--white);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="SaDeNaPalmaDaMODesignSystem_077ed4.Icon" name="building-2" size="{{ 18 }}" color="#fff" hint-size="18px,18px"></x-import></span>
        <span style="position:absolute;left:8px;bottom:6px;background:var(--white);border-radius:999px;padding:2px 10px;font:500 calc(12px*var(--fs,1))/calc(18px*var(--fs,1)) var(--font-family);color:var(--ink-muted)">Mapa demonstrativo</span>
      </div>
    </section>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,calc(140px*var(--fs,1))),1fr));gap:12px">
      <x-import component-from-global-scope="SaDeNaPalmaDaMODesignSystem_077ed4.Button" icon="navigation" onClick="{{ onRoute }}" hint-size="100%,48px">Como chegar</x-import>
      <x-import component-from-global-scope="SaDeNaPalmaDaMODesignSystem_077ed4.Button" variant="outline" icon="phone" onClick="{{ onCall }}" hint-size="100%,48px">Ligar</x-import>
      <x-import component-from-global-scope="SaDeNaPalmaDaMODesignSystem_077ed4.Button" variant="outline" icon="calendar-clock" onClick="{{ ap.onResched }}" hint-size="100%,48px">Remarcar</x-import>
      <x-import component-from-global-scope="SaDeNaPalmaDaMODesignSystem_077ed4.Button" variant="whatsapp" onClick="{{ onWhats }}" hint-size="100%,48px">WhatsApp</x-import>
    </div>
    <section style="display:flex;flex-direction:column;gap:10px">
      <h2 style="margin:0;font:700 calc(18px*var(--fs,1))/calc(26px*var(--fs,1)) var(--font-family);color:var(--teal-600)">Orientações para o dia</h2>
      <sc-for list="{{ ap.orientList }}" as="o" hint-placeholder-count="4">
        <div style="display:flex;gap:12px;align-items:center;font:400 calc(16px*var(--fs,1))/calc(22px*var(--fs,1)) var(--font-family)">
          <span style="flex:none;width:34px;height:34px;border-radius:8px;background:#e3f1f1;display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="SaDeNaPalmaDaMODesignSystem_077ed4.Icon" name="{{ o.icon }}" size="{{ 20 }}" color="var(--teal-600)" hint-size="20px,20px"></x-import></span>
          <span>{{ o.text }}</span>
        </div>
      </sc-for>
    </section>
    <button type="button" onClick="{{ ap.onCancel }}" style="min-height:48px;border-radius:14px;border:2px solid var(--error);background:var(--white);color:var(--error);font:500 calc(16px*var(--fs,1))/calc(22px*var(--fs,1)) var(--font-family);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px"><x-import component-from-global-scope="SaDeNaPalmaDaMODesignSystem_077ed4.Icon" name="calendar-x" color="var(--error)" hint-size="22px,22px"></x-import>Cancelar consulta</button>
  </div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals() { return this.props.vm || {}; }
}
</script>
</body>
</html>
