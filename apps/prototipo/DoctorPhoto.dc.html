<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<img src="{{ src }}" alt="{{ alt }}" style="width:{{ px }};height:{{ px }};border-radius:50%;object-fit:cover;display:block;flex:none">
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;80px&quot;,&quot;height&quot;:&quot;80px&quot;},&quot;id&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;carlos&quot;,&quot;juliana&quot;,&quot;paulo&quot;],&quot;default&quot;:&quot;carlos&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:56,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const id = this.props.id || 'carlos';
    return { src: 'assets/medicos/' + id + '.png', alt: this.props.alt || '', px: (this.props.size || 56) + 'px' };
  }
}
</script>
</body>
</html>
