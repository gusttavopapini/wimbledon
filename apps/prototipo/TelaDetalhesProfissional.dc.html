<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- Tela "medico" do app Saúde na Palma da Mão.
     Recebe o view-model inteiro via prop "vm" (montado em spm-view.js). -->
  <div data-screen-label="04 Detalhes do profissional" style="display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;gap:16px;align-items:center">
      <sc-if value="{{ dr.hasPhoto }}" hint-placeholder-val="{{ false }}"><dc-import name="DoctorPhoto" id="{{ dr.photoId }}" size="{{ 84 }}" hint-size="84px,84px"></dc-import></sc-if>
      <sc-if value="{{ dr.noPhoto }}" hint-placeholder-val="{{ true }}"><span style="width:84px;height:84px;flex:none;border-radius:50%;background:var(--teal-100);color:var(--teal-700);display:flex;align-items:center;justify-content:center;font:700 calc(28px*var(--fs,1))/1 var(--font-family)">{{ dr.initials }}</span></sc-if>
      <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
        <h1 style="margin:0;font:700 calc(22px*var(--fs,1))/calc(28px*var(--fs,1)) var(--font-family);color:var(--teal-600)">{{ dr.name }}</h1>
        <span style="font:400 calc(16px*var(--fs,1))/calc(22px*var(--fs,1)) var(--font-family)">{{ dr.pro }}</span>
        <span style="font:400 calc(14px*var(--fs,1))/calc(20px*var(--fs,1)) var(--font-family);color:var(--ink-muted);white-space:nowrap">{{ dr.crm }}</span>
      </div>
    </div>
    <section style="display:flex;flex-direction:column;gap:6px">
      <h2 style="margin:0;font:700 calc(18px*var(--fs,1))/calc(26px*var(--fs,1)) var(--font-family);color:var(--teal-600)">Sobre</h2>
      <p style="margin:0;font:400 calc(17px*var(--fs,1))/calc(26px*var(--fs,1)) var(--font-family);text-wrap:pretty">{{ dr.bio }}</p>
    </section>
    <section style="border:1px solid var(--border-subtle);border-radius:16px;box-shadow:0 1px 3px rgba(3,117,127,.06);padding:16px;display:flex;flex-direction:column;gap:14px">
      <sc-for list="{{ dr.rows }}" as="r" hint-placeholder-count="4">
        <div style="display:flex;gap:12px;align-items:flex-start">
          <x-import component-from-global-scope="SaDeNaPalmaDaMODesignSystem_077ed4.Icon" name="{{ r.icon }}" hint-size="24px,24px"></x-import>
          <div style="display:flex;flex-direction:column;min-width:0"><span style="font:400 calc(14px*var(--fs,1))/calc(20px*var(--fs,1)) var(--font-family);color:var(--ink-muted)">{{ r.label }}</span><span style="font:500 calc(17px*var(--fs,1))/calc(24px*var(--fs,1)) var(--font-family)">{{ r.value }}</span></div>
        </div>
      </sc-for>
      <div style="position:relative;height:120px;border-radius:10px;overflow:hidden;background:var(--surface-2)">
        <svg viewBox="0 0 300 120" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"><path d="M0 60 L300 50" stroke="#fff" stroke-width="9"></path><path d="M110 0 L130 120" stroke="#fff" stroke-width="7"></path><path d="M-10 100 C 80 80, 160 120, 310 90" stroke="#cfe3e6" stroke-width="12" fill="none"></path><rect x="200" y="10" width="60" height="26" rx="4" fill="#dcebdc"></rect></svg>
        <span style="position:absolute;left:52%;top:44%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:var(--teal-600);border:2px solid var(--white);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="SaDeNaPalmaDaMODesignSystem_077ed4.Icon" name="building-2" size="{{ 18 }}" color="#fff" hint-size="18px,18px"></x-import></span>
        <span style="position:absolute;left:8px;bottom:6px;background:var(--white);border-radius:999px;padding:2px 10px;font:500 calc(12px*var(--fs,1))/calc(18px*var(--fs,1)) var(--font-family);color:var(--ink-muted)">Mapa demonstrativo</span>
      </div>
    </section>
    <section style="display:flex;flex-direction:column;gap:8px">
      <h2 style="margin:0;font:700 calc(18px*var(--fs,1))/calc(26px*var(--fs,1)) var(--font-family);color:var(--teal-600)">Convênios aceitos</h2>
      <sc-if value="{{ dr.hasConv }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <sc-for list="{{ dr.conv }}" as="c" hint-placeholder-count="3"><span style="padding:6px 14px;border-radius:999px;background:var(--teal-100);color:var(--teal-700);font:500 calc(15px*var(--fs,1))/calc(20px*var(--fs,1)) var(--font-family)">{{ c }}</span></sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ dr.noConv }}" hint-placeholder-val="{{ false }}"><span style="font:400 calc(17px*var(--fs,1))/calc(24px*var(--fs,1)) var(--font-family);color:var(--ink-muted)">Atende apenas particular.</span></sc-if>
    </section>
    <section style="display:flex;flex-direction:column;gap:8px">
      <h2 style="margin:0;font:700 calc(18px*var(--fs,1))/calc(26px*var(--fs,1)) var(--font-family);color:var(--teal-600)">Acessibilidade da clínica</h2>
      <sc-for list="{{ dr.acc }}" as="ac" hint-placeholder-count="3">
        <div style="display:flex;gap:10px;align-items:center;font:400 calc(17px*var(--fs,1))/calc(24px*var(--fs,1)) var(--font-family)"><x-import component-from-global-scope="SaDeNaPalmaDaMODesignSystem_077ed4.Icon" name="circle-check" color="var(--success)" hint-size="24px,24px"></x-import>{{ ac }}</div>
      </sc-for>
    </section>
    <div style="position:sticky;bottom:0;z-index:3;margin:0 -20px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:var(--white);border-top:1px solid var(--border-subtle);display:grid;grid-template-columns:1fr 1.4fr;gap:12px">
      <x-import component-from-global-scope="SaDeNaPalmaDaMODesignSystem_077ed4.Button" variant="outline" icon="navigation" onClick="{{ onRoute }}" hint-size="100%,48px">Como chegar</x-import>
      <x-import component-from-global-scope="SaDeNaPalmaDaMODesignSystem_077ed4.Button" icon="calendar-plus" onClick="{{ dr.onBook }}" hint-size="100%,56px">Agendar consulta</x-import>
    </div>
  </div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals() { return this.props.vm || {}; }
}
</script>
</body>
</html>
