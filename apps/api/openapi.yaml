openapi: 3.1.0
info:
  title: Saúde na Palma da Mão — API
  version: 0.1.0
  summary: Pré-triagem, agendamento e fila presencial do polo médico do Recife.
  description: |
    Único ponto de acesso aos dados. Nenhum cliente (app, PWA, painel de TV,
    automações N8N) acessa o Firestore diretamente.

    - Base: `/api/v1`. Recursos no plural, em português, camelCase.
    - Datas em ISO 8601 com offset `-03:00` (America/Recife); gravadas em UTC.
    - Autenticação: `Authorization: Bearer <ID token do Firebase Auth>`.
    - Todo erro segue o esquema `Erro`.
servers:
  - url: http://localhost:3333
    description: Desenvolvimento local
tags:
  - name: Saúde
    description: Monitoramento da API
  - name: Acesso
    description: Cadastro de pacientes e sessão
  - name: Usuários
    description: Dados e preferências da própria conta
  - name: Cadastros
    description: Especialidades, unidades e médicos. Leitura pública; escrita do administrativo.
paths:
  /health:
    get:
      tags: [Saúde]
      summary: Verifica se a API está no ar
      operationId: verificarSaude
      security: []
      responses:
        '200':
          description: API no ar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Saude'
              example:
                status: ok
                versao: 0.1.0
                em: '2026-10-04T20:40:00.000-03:00'
  /api/v1/auth/cadastro:
    post:
      tags: [Acesso]
      summary: Cria a conta de um paciente (público)
      description: |
        Valida os dados, garante CPF e e-mail únicos (transação com documentos-trava,
        segura contra cadastros simultâneos), cria a conta no Firebase Auth, grava
        `usuarios/{uid}` e define a claim `perfil: "paciente"`. Perfil e status não
        podem ser enviados pelo cliente. Limite: 10 cadastros por IP a cada 15 minutos.
      operationId: cadastrarPaciente
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cadastro'
            example:
              nome: Maria Teste da Silva
              cpf: 529.982.247-25
              dataNascimento: '1948-03-12'
              telefone: (81) 99999-1234
              email: maria@exemplo.test
              senha: minha-senha-123
              sexo: feminino
              consentimento:
                versaoTermo: '2026-10-01'
                aceito: true
                canal: app
                exibicaoPainel: false
      responses:
        '201':
          description: Conta criada
          headers:
            Location:
              description: URI do usuário criado
              schema:
                type: string
                example: /api/v1/usuarios/Xk3c9aQ2LmT0pR8sV1wZ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContaCriada'
              example:
                id: Xk3c9aQ2LmT0pR8sV1wZ
                nome: Maria Teste da Silva
                perfil: paciente
                status: ativo
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '409':
          description: CPF ou e-mail já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                cpf:
                  value:
                    erro:
                      codigo: CPF_JA_CADASTRADO
                      mensagem: Já existe uma conta com esse CPF. Toque em Entrar ou, se não lembrar a senha, em Esqueci minha senha.
                      detalhes: null
                      requestId: 3f1c2a9e-0b7d-4c55-9a51-2f7d8e6b1c40
                email:
                  value:
                    erro:
                      codigo: EMAIL_JA_CADASTRADO
                      mensagem: Já existe uma conta com esse e-mail. Toque em Entrar ou, se não lembrar a senha, em Esqueci minha senha.
                      detalhes: null
                      requestId: 3f1c2a9e-0b7d-4c55-9a51-2f7d8e6b1c40
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/auth/me:
    get:
      tags: [Acesso]
      summary: Devolve o usuário logado e o perfil
      operationId: buscarMe
      responses:
        '200':
          description: Usuário logado
          content:
            application/json:
              schema:
                type: object
                required: [usuario, perfil]
                properties:
                  usuario:
                    $ref: '#/components/schemas/Usuario'
                  perfil:
                    $ref: '#/components/schemas/Perfil'
              example:
                perfil: paciente
                usuario:
                  id: Xk3c9aQ2LmT0pR8sV1wZ
                  nome: Maria Teste da Silva
                  email: maria@exemplo.test
                  cpf: '52998224725'
                  telefone: '5581999991234'
                  dataNascimento: '1948-03-12'
                  sexo: feminino
                  perfil: paciente
                  unidadeId: null
                  unidadeIds: []
                  preferencias:
                    letraGrande: false
                    altoContraste: false
                    lembreteWhatsapp: false
                  consentimento:
                    versaoTermo: '2026-10-01'
                    aceitoEm: '2026-10-04T20:40:00.000-03:00'
                    canal: app
                    exibicaoPainel: false
                  status: ativo
                  criadoEm: '2026-10-04T20:40:00.000-03:00'
                  atualizadoEm: '2026-10-04T20:40:00.000-03:00'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/usuarios/me:
    put:
      tags: [Usuários]
      summary: Substitui os dados editáveis e as preferências de acessibilidade
      description: |
        Envia o conjunto editável completo. Campo opcional ausente (`sexo`,
        `telefone`, `dataNascimento`) é removido. Ligar `lembreteWhatsapp` exige
        telefone (400). `consentimento.exibicaoPainel`, se enviado, troca o aceite de
        exibir o nome completo no painel de TV; se ausente, mantém o atual.
        CPF, e-mail, perfil e status não são aceitos (400).
      operationId: atualizarMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarMe'
            example:
              nome: Maria Teste da Silva
              telefone: (81) 99999-1234
              dataNascimento: '1948-03-12'
              sexo: feminino
              preferencias:
                letraGrande: true
                altoContraste: false
                lembreteWhatsapp: true
              consentimento:
                exibicaoPainel: true
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/especialidades:
    get:
      tags: [Cadastros]
      summary: Lista as especialidades ativas, por nome (público)
      operationId: listarEspecialidades
      security: []
      responses:
        '200':
          description: Especialidades ativas
          content:
            application/json:
              schema:
                type: object
                required: [itens]
                properties:
                  itens:
                    type: array
                    items:
                      $ref: '#/components/schemas/Especialidade'
              example:
                itens:
                  - id: cardiologia
                    nome: Cardiologia
                    descricao: Cuida do coração, da pressão e da circulação do sangue.
                    palavrasChave: [coração, pressão alta, palpitação]
                    ativa: true
                    criadoEm: '2026-10-05T09:00:00.000-03:00'
                    atualizadoEm: '2026-10-05T09:00:00.000-03:00'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
    post:
      tags: [Cadastros]
      summary: Cadastra uma especialidade (administrativo)
      description: O id sai do nome ("Clínico geral" vira `clinicoGeral`) e casa com o ícone do app.
      operationId: criarEspecialidade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarEspecialidade'
            example:
              nome: Cardiologia
              descricao: Cuida do coração, da pressão e da circulação do sangue.
              palavrasChave: [coração, pressão alta, palpitação]
      responses:
        '201':
          description: Especialidade criada
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/especialidades/cardiologia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Especialidade'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '409':
          $ref: '#/components/responses/Conflito'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/especialidades/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Cadastros]
      summary: Uma especialidade ativa (público)
      operationId: buscarEspecialidade
      security: []
      responses:
        '200':
          description: Especialidade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Especialidade'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
    put:
      tags: [Cadastros]
      summary: Substitui os dados de uma especialidade (administrativo); ativa true reativa
      operationId: atualizarEspecialidade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarEspecialidade'
            example:
              nome: Cardiologia
              descricao: Cuida do coração, da pressão e da circulação do sangue.
              palavrasChave: [coração, pressão alta]
              ativa: true
      responses:
        '200':
          description: Especialidade atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Especialidade'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
    delete:
      tags: [Cadastros]
      summary: Desativa uma especialidade (administrativo). Nunca apaga.
      operationId: desativarEspecialidade
      responses:
        '204':
          description: Desativada
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/unidades:
    get:
      tags: [Cadastros]
      summary: Lista as unidades ativas, por nome (público)
      description: |
        `especialidadeId` e `bairro` filtram no banco (bairro sem diferenciar
        maiúscula e acento). `busca` procura um trecho no nome, no bairro ou na rua.
      operationId: listarUnidades
      security: []
      parameters:
        - name: busca
          in: query
          schema: { type: string, maxLength: 60 }
          example: boa vista
        - name: bairro
          in: query
          schema: { type: string }
          example: Ilha do Leite
        - name: especialidadeId
          in: query
          schema: { type: string }
          example: cardiologia
      responses:
        '200':
          description: Unidades ativas
          content:
            application/json:
              schema:
                type: object
                required: [itens]
                properties:
                  itens:
                    type: array
                    items:
                      $ref: '#/components/schemas/Unidade'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
    post:
      tags: [Cadastros]
      summary: Cadastra uma unidade (administrativo)
      operationId: criarUnidade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarUnidade'
            example:
              nome: Hospital Aurora das Marés
              tipo: hospital
              cnpj: 11.222.333/0001-81
              endereco:
                logradouro: Rua das Jangadas
                numero: '120'
                bairro: Ilha do Leite
                cidade: Recife
                uf: PE
                cep: 50070-120
              telefone: (81) 3200-1000
              especialidadeIds: [cardiologia, clinicoGeral]
      responses:
        '201':
          description: Unidade criada
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/unidades/Xk3c9aQ2LmT0pR8sV1wZ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unidade'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/NaoProcessavel'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/unidades/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Cadastros]
      summary: Uma unidade ativa (público)
      operationId: buscarUnidade
      security: []
      responses:
        '200':
          description: Unidade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unidade'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
    put:
      tags: [Cadastros]
      summary: Substitui os dados de uma unidade (administrativo); ativa true reativa
      operationId: atualizarUnidade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarUnidade'
            example:
              nome: Hospital Aurora das Marés
              tipo: hospital
              cnpj: '11222333000181'
              endereco:
                logradouro: Rua das Jangadas
                numero: '120'
                bairro: Ilha do Leite
                cidade: Recife
                uf: PE
                cep: '50070120'
              telefone: '558132001000'
              especialidadeIds: [cardiologia, clinicoGeral, pediatria]
              ativa: true
      responses:
        '200':
          description: Unidade atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unidade'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/NaoProcessavel'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
    delete:
      tags: [Cadastros]
      summary: Desativa uma unidade (administrativo). Nunca apaga.
      operationId: desativarUnidade
      responses:
        '204':
          description: Desativada
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/medicos:
    get:
      tags: [Cadastros]
      summary: Lista os médicos ativos, por nome (público)
      operationId: listarMedicos
      security: []
      parameters:
        - name: unidadeId
          in: query
          schema: { type: string }
        - name: especialidadeId
          in: query
          schema: { type: string }
          example: cardiologia
      responses:
        '200':
          description: Médicos ativos
          content:
            application/json:
              schema:
                type: object
                required: [itens]
                properties:
                  itens:
                    type: array
                    items:
                      $ref: '#/components/schemas/Medico'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
    post:
      tags: [Cadastros]
      summary: Cadastra um médico (somente administrativo; a manutenção não cadastra)
      operationId: criarMedico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarMedico'
            example:
              nome: Dra. Helena Marinho Duarte
              conselho: { tipo: CRM, numero: '214365', uf: PE }
              especialidadeIds: [cardiologia]
              unidadeIds: [Xk3c9aQ2LmT0pR8sV1wZ]
              usuarioId: null
      responses:
        '201':
          description: Médico cadastrado
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/medicos/Qm7d2bR4NpU1sT9vW3xY
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicoCompleto'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/NaoProcessavel'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/medicos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Cadastros]
      summary: Um médico ativo (público)
      operationId: buscarMedico
      security: []
      responses:
        '200':
          description: Médico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medico'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
    put:
      tags: [Cadastros]
      summary: Substitui os dados de um médico (somente administrativo)
      description: Ao tirar uma unidade ou desativar, a conta ligada perde o acesso na hora (tokens revogados).
      operationId: atualizarMedico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarMedico'
            example:
              nome: Dra. Helena Marinho Duarte
              conselho: { tipo: CRM, numero: '214365', uf: PE }
              especialidadeIds: [cardiologia, clinicoGeral]
              unidadeIds: [Xk3c9aQ2LmT0pR8sV1wZ]
              usuarioId: null
              ativo: true
      responses:
        '200':
          description: Médico atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicoCompleto'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/NaoProcessavel'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
    delete:
      tags: [Cadastros]
      summary: Desativa um médico (somente administrativo). Nunca apaga.
      operationId: desativarMedico
      responses:
        '204':
          description: Desativado
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/medicos/{id}/unidades:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Cadastros]
      summary: Aloca o médico numa unidade (administrativo ou manutenção da própria unidade)
      description: |
        Idempotente: 201 com Location na primeira vez, 200 se o médico já estava
        na unidade. Manutenção de outra unidade recebe 403 FORA_DA_UNIDADE.
      operationId: alocarMedico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [unidadeId]
              properties:
                unidadeId:
                  type: string
            example:
              unidadeId: Xk3c9aQ2LmT0pR8sV1wZ
      responses:
        '200':
          description: O médico já estava nessa unidade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medico'
        '201':
          description: Médico alocado
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/medicos/Qm7d2bR4NpU1sT9vW3xY/unidades/Xk3c9aQ2LmT0pR8sV1wZ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medico'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '422':
          $ref: '#/components/responses/NaoProcessavel'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/medicos/{id}/unidades/{unidadeId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: unidadeId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Cadastros]
      summary: Desaloca o médico de uma unidade (administrativo ou manutenção da própria unidade)
      description: Idempotente. A conta ligada perde o acesso à unidade na hora.
      operationId: desalocarMedico
      responses:
        '204':
          description: Desalocado (ou já não estava na unidade)
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
components:
  securitySchemes:
    tokenFirebase:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ID token emitido pelo Firebase Auth após o login no app.
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Letras, números, "_" e "-". Outro formato responde 400.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,128}$'
  responses:
    AcessoNegado:
      description: Perfil sem permissão (ACESSO_NEGADO) ou unidade de outra pessoa (FORA_DA_UNIDADE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            perfil:
              value:
                erro:
                  codigo: ACESSO_NEGADO
                  mensagem: Sua conta não tem acesso a esta parte do app. Se precisar, fale com a administração da unidade.
                  detalhes: null
                  requestId: 3f1c2a9e-0b7d-4c55-9a51-2f7d8e6b1c40
            unidade:
              value:
                erro:
                  codigo: FORA_DA_UNIDADE
                  mensagem: Você só pode ver informações da unidade onde trabalha.
                  detalhes: null
                  requestId: 3f1c2a9e-0b7d-4c55-9a51-2f7d8e6b1c40
    Conflito:
      description: Já existe (ESPECIALIDADE_JA_CADASTRADA, CNPJ_JA_CADASTRADO ou CONSELHO_JA_CADASTRADO).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro:
              codigo: CNPJ_JA_CADASTRADO
              mensagem: Já existe uma unidade com esse CNPJ. Confira os números ou edite a unidade que já existe.
              detalhes: null
              requestId: 3f1c2a9e-0b7d-4c55-9a51-2f7d8e6b1c40
    NaoProcessavel:
      description: |
        Formato certo, mas aponta para algo que não existe ou está desativado:
        ESPECIALIDADE_NAO_CADASTRADA, UNIDADE_NAO_CADASTRADA, MEDICO_NAO_CADASTRADO,
        MEDICO_INATIVO ou USUARIO_NAO_E_MEDICO.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro:
              codigo: MEDICO_NAO_CADASTRADO
              mensagem: Esse médico não está cadastrado. Peça para a administração cadastrar o médico antes de alocar.
              detalhes:
                - campo: id
                  mensagem: Não há médico cadastrado com o id Qm7d2bR4NpU1sT9vW3xY.
              requestId: 3f1c2a9e-0b7d-4c55-9a51-2f7d8e6b1c40
    DadosInvalidos:
      description: Dados inválidos. `detalhes` traz um item por campo, com a mensagem para a pessoa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro:
              codigo: DADOS_INVALIDOS
              mensagem: Alguns dados precisam de ajuste. Confira os campos indicados e tente de novo.
              detalhes:
                - campo: cpf
                  mensagem: Falta 1 número. Confira no seu documento e digite os 11 números.
                - campo: email
                  mensagem: 'Falta o final do e-mail. Exemplo: ana@gmail.com'
              requestId: 3f1c2a9e-0b7d-4c55-9a51-2f7d8e6b1c40
    NaoAutenticado:
      description: Sem token, token inválido, expirado, revogado ou de conta desativada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro:
              codigo: NAO_AUTENTICADO
              mensagem: Entre na sua conta para continuar.
              detalhes: null
              requestId: 3f1c2a9e-0b7d-4c55-9a51-2f7d8e6b1c40
    NaoEncontrado:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro:
              codigo: NAO_ENCONTRADO
              mensagem: Não encontramos os dados da sua conta. Saia e entre de novo; se continuar, fale com a recepção.
              detalhes: null
              requestId: 3f1c2a9e-0b7d-4c55-9a51-2f7d8e6b1c40
    LimiteExcedido:
      description: Muitas requisições do mesmo IP. Veja os cabeçalhos RateLimit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro:
              codigo: LIMITE_EXCEDIDO
              mensagem: Foram muitas tentativas seguidas. Espere alguns minutos e tente de novo.
              detalhes: null
              requestId: 3f1c2a9e-0b7d-4c55-9a51-2f7d8e6b1c40
    ErroInterno:
      description: Erro inesperado. A causa fica só no log, com o mesmo requestId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro:
              codigo: ERRO_INTERNO
              mensagem: Algo não funcionou do nosso lado. Tente de novo em alguns minutos.
              detalhes: null
              requestId: 3f1c2a9e-0b7d-4c55-9a51-2f7d8e6b1c40
  schemas:
    Perfil:
      type: string
      enum: [paciente, recepcionista, medico, manutencao, administrativo]
    Preferencias:
      type: object
      additionalProperties: false
      required: [letraGrande, altoContraste, lembreteWhatsapp]
      properties:
        letraGrande:
          type: boolean
        altoContraste:
          type: boolean
        lembreteWhatsapp:
          type: boolean
    Cadastro:
      type: object
      additionalProperties: false
      required: [nome, cpf, dataNascimento, telefone, email, senha, consentimento]
      properties:
        nome:
          type: string
          maxLength: 120
          description: Nome e sobrenome, como no documento.
        cpf:
          type: string
          description: Com ou sem máscara; gravado só com os 11 dígitos.
        dataNascimento:
          type: string
          format: date
          description: AAAA-MM-DD
        telefone:
          type: string
          description: Com DDD, com ou sem máscara; gravado em E.164 sem o "+".
        email:
          type: string
          format: email
        senha:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
        sexo:
          $ref: '#/components/schemas/Sexo'
        consentimento:
          type: object
          additionalProperties: false
          required: [versaoTermo, aceito, exibicaoPainel]
          properties:
            versaoTermo:
              type: string
              description: Precisa ser a versão vigente do termo.
            aceito:
              type: boolean
              const: true
            canal:
              type: string
              enum: [app, pwa]
              default: app
            exibicaoPainel:
              type: boolean
              description: Aceite específico para exibir e anunciar o nome completo no painel de TV da recepção.
    Sexo:
      type: string
      enum: [feminino, masculino, outro, prefiro_nao_informar]
    ContaCriada:
      type: object
      required: [id, nome, perfil, status]
      properties:
        id:
          type: string
        nome:
          type: string
        perfil:
          $ref: '#/components/schemas/Perfil'
        status:
          type: string
          enum: [ativo, pre_cadastro, inativo]
    AtualizarMe:
      type: object
      additionalProperties: false
      required: [nome, preferencias]
      properties:
        nome:
          type: string
        telefone:
          type: string
        dataNascimento:
          type: string
          format: date
        sexo:
          $ref: '#/components/schemas/Sexo'
        preferencias:
          $ref: '#/components/schemas/Preferencias'
        consentimento:
          type: object
          additionalProperties: false
          required: [exibicaoPainel]
          properties:
            exibicaoPainel:
              type: boolean
    Usuario:
      type: object
      required:
        [id, nome, email, cpf, perfil, preferencias, consentimento, status, criadoEm, atualizadoEm]
      properties:
        id:
          type: string
        nome:
          type: string
        email:
          type: string
          format: email
        cpf:
          type: string
          pattern: '^\d{11}$'
        telefone:
          type: [string, 'null']
          description: E.164 sem o "+"
        dataNascimento:
          type: [string, 'null']
          format: date
        sexo:
          oneOf:
            - $ref: '#/components/schemas/Sexo'
            - type: 'null'
        perfil:
          $ref: '#/components/schemas/Perfil'
        unidadeId:
          type: [string, 'null']
        unidadeIds:
          type: array
          items:
            type: string
        preferencias:
          $ref: '#/components/schemas/Preferencias'
        consentimento:
          type: object
          required: [versaoTermo, aceitoEm, canal, exibicaoPainel]
          properties:
            versaoTermo:
              type: string
            aceitoEm:
              type: string
              format: date-time
            canal:
              type: string
              enum: [app, pwa, recepcao, seed]
            exibicaoPainel:
              type: boolean
        status:
          type: string
          enum: [ativo, pre_cadastro, inativo]
        criadoEm:
          type: string
          format: date-time
          description: ISO 8601 com offset -03:00
        atualizadoEm:
          type: string
          format: date-time
    Especialidade:
      type: object
      required: [id, nome, descricao, palavrasChave, ativa, criadoEm, atualizadoEm]
      properties:
        id:
          type: string
          description: Igual ao nome do ícone no app (cardiologia, clinicoGeral…).
        nome: { type: string }
        descricao: { type: string }
        palavrasChave:
          type: array
          items: { type: string }
        ativa: { type: boolean }
        criadoEm: { type: string, format: date-time }
        atualizadoEm: { type: string, format: date-time }
    CriarEspecialidade:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CamposEspecialidade'
    CamposEspecialidade:
      type: object
      required: [nome, descricao]
      properties:
        nome: { type: string, minLength: 3, maxLength: 60 }
        descricao: { type: string, minLength: 10, maxLength: 300 }
        palavrasChave:
          type: array
          maxItems: 30
          items: { type: string }
    AtualizarEspecialidade:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CamposEspecialidade'
        - type: object
          required: [palavrasChave, ativa]
          properties:
            ativa: { type: boolean }
    Endereco:
      type: object
      additionalProperties: false
      required: [logradouro, numero, bairro, cidade, uf, cep]
      properties:
        logradouro: { type: string }
        numero: { type: string }
        bairro: { type: string }
        cidade: { type: string }
        uf: { type: string, minLength: 2, maxLength: 2 }
        cep: { type: string, description: 'Com ou sem máscara; gravado com 8 dígitos.' }
    Unidade:
      type: object
      required: [id, nome, tipo, cnpj, endereco, bairroBusca, telefone, especialidadeIds, ativa]
      properties:
        id: { type: string }
        nome: { type: string }
        tipo: { type: string, enum: [hospital, clinica] }
        cnpj: { type: string, pattern: '^\d{14}$' }
        endereco:
          $ref: '#/components/schemas/Endereco'
        bairroBusca:
          type: string
          description: Bairro em minúsculo e sem acento, gerado pela API.
        telefone: { type: string, description: E.164 sem o "+" }
        especialidadeIds:
          type: array
          items: { type: string }
        ativa: { type: boolean }
        criadoEm: { type: string, format: date-time }
        atualizadoEm: { type: string, format: date-time }
    CriarUnidade:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CamposUnidade'
    CamposUnidade:
      type: object
      required: [nome, tipo, cnpj, endereco, telefone, especialidadeIds]
      properties:
        nome: { type: string }
        tipo: { type: string, enum: [hospital, clinica] }
        cnpj: { type: string, description: Com ou sem máscara. }
        endereco:
          $ref: '#/components/schemas/Endereco'
        telefone: { type: string }
        especialidadeIds:
          type: array
          minItems: 1
          items: { type: string }
    AtualizarUnidade:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CamposUnidade'
        - type: object
          required: [ativa]
          properties:
            ativa: { type: boolean }
    Conselho:
      type: object
      additionalProperties: false
      required: [tipo, numero, uf]
      properties:
        tipo: { type: string, const: CRM }
        numero: { type: string, description: Só dígitos; zeros à esquerda são removidos. }
        uf: { type: string }
    Medico:
      type: object
      required: [id, nome, conselho, especialidadeIds, unidadeIds, ativo]
      properties:
        id: { type: string }
        nome: { type: string, description: Com "Dr." ou "Dra." }
        conselho:
          $ref: '#/components/schemas/Conselho'
        especialidadeIds:
          type: array
          items: { type: string }
        unidadeIds:
          type: array
          items: { type: string }
        ativo: { type: boolean }
        criadoEm: { type: string, format: date-time }
        atualizadoEm: { type: string, format: date-time }
    MedicoCompleto:
      allOf:
        - $ref: '#/components/schemas/Medico'
        - type: object
          required: [usuarioId, criadoPorAdministrativo]
          properties:
            usuarioId: { type: [string, 'null'] }
            criadoPorAdministrativo: { type: string }
    CriarMedico:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CamposMedico'
    CamposMedico:
      type: object
      required: [nome, conselho, especialidadeIds, unidadeIds]
      properties:
        nome: { type: string }
        conselho:
          $ref: '#/components/schemas/Conselho'
        especialidadeIds:
          type: array
          minItems: 1
          items: { type: string }
        unidadeIds:
          type: array
          minItems: 1
          items: { type: string }
        usuarioId:
          type: [string, 'null']
          description: Conta do médico no app (perfil medico), se já existir.
    AtualizarMedico:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CamposMedico'
        - type: object
          required: [ativo]
          properties:
            ativo: { type: boolean }
    Saude:
      type: object
      required: [status, versao, em]
      properties:
        status:
          type: string
          const: ok
        versao:
          type: string
          description: Versão da API (package.json)
        em:
          type: string
          format: date-time
          description: Momento da resposta, em UTC
    Erro:
      type: object
      required: [erro]
      properties:
        erro:
          type: object
          required: [codigo, mensagem, requestId]
          properties:
            codigo:
              type: string
              enum:
                - DADOS_INVALIDOS
                - NAO_AUTENTICADO
                - ACESSO_NEGADO
                - FORA_DA_UNIDADE
                - NAO_ENCONTRADO
                - CPF_JA_CADASTRADO
                - EMAIL_JA_CADASTRADO
                - ESPECIALIDADE_JA_CADASTRADA
                - CNPJ_JA_CADASTRADO
                - CONSELHO_JA_CADASTRADO
                - ESPECIALIDADE_NAO_CADASTRADA
                - UNIDADE_NAO_CADASTRADA
                - MEDICO_NAO_CADASTRADO
                - MEDICO_INATIVO
                - USUARIO_NAO_E_MEDICO
                - LIMITE_EXCEDIDO
                - ERRO_INTERNO
            mensagem:
              type: string
              description: Texto para a pessoa, dizendo o que fazer.
            detalhes:
              description: Lista de {campo, mensagem} em erros de validação; null nos demais.
              oneOf:
                - type: 'null'
                - type: array
                  items:
                    type: object
                    required: [campo, mensagem]
                    properties:
                      campo:
                        type: string
                      mensagem:
                        type: string
            requestId:
              type: string
security:
  - tokenFirebase: []
