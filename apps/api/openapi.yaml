        '500':
          $ref: '#/components/responses/ErroInterno'
      security: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              telefone: '5581990000001'
              medicoId: Qm7d2bR4NpU1sT9vW3xY
              unidadeId: Xk3c9aQ2LmT0pR8sV1wZ
              especialidadeId: pneumologia
              data: '2026-11-25'
              hora: 09:30
  /api/v1/integracoes/agendamentos/{id}/cancelar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags:
        - Integrações
      summary: Cancela pelo WhatsApp (RN04)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/NaoProcessavel'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
      security: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              telefone: '5581990000001'
components:
  securitySchemes:
    tokenFirebase:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ID token emitido pelo Firebase Auth após o login no app.
    tokenDispositivo:
      type: apiKey
      in: header
      name: X-Device-Token
      description: Token do painel de TV, obtido no pareamento. Só leitura, uma unidade (RN25).
    chaveIntegracao:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Chave das integrações (N8N). Só vale em /integracoes/*.
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Letras, números, "_" e "-". Outro formato responde 400.
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,128}$
  responses:
    AcessoNegado:
      description: Perfil sem permissão (ACESSO_NEGADO) ou unidade de outra pessoa (FORA_DA_UNIDADE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            perfil:
              value:
                erro:
                  codigo: ACESSO_NEGADO
                  mensagem:
                    Sua conta não tem acesso a esta parte do app. Se precisar, fale com a administração
                    da unidade.
                  detalhes: null
                  requestId: 3f1c2a9e-0b7d-4c55-9a51-2f7d8e6b1c40
            unidade:
              value:
                erro:
                  codigo: FORA_DA_UNIDADE
                  mensagem: Você só pode ver informações da unidade onde trabalha.
                  detalhes: null
                  requestId: 3f1c2a9e-0b7d-4c55-9a51-2f7d8e6b1c40
    Conflito:
      description: Já existe (ESPECIALIDADE_JA_CADASTRADA, CNPJ_JA_CADASTRADO ou CONSELHO_JA_CADASTRADO).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro:
              codigo: CNPJ_JA_CADASTRADO
              mensagem:
                Já existe uma unidade com esse CNPJ. Confira os números ou edite a unidade que
                já existe.
              detalhes: null
              requestId: 3f1c2a9e-0b7d-4c55-9a51-2f7d8e6b1c40
    NaoProcessavel:
      description: 'Formato certo, mas aponta para algo que não existe ou está desativado:

        ESPECIALIDADE_NAO_CADASTRADA, UNIDADE_NAO_CADASTRADA, MEDICO_NAO_CADASTRADO,

        MEDICO_INATIVO ou USUARIO_NAO_E_MEDICO.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro:
              codigo: MEDICO_NAO_CADASTRADO
              mensagem:
                Esse médico não está cadastrado. Peça para a administração cadastrar o médico
                antes de alocar.
              detalhes:
                - campo: id
                  mensagem: Não há médico cadastrado com o id Qm7d2bR4NpU1sT9vW3xY.
              requestId: 3f1c2a9e-0b7d-4c55-9a51-2f7d8e6b1c40
    DadosInvalidos:
      description: Dados inválidos. `detalhes` traz um item por campo, com a mensagem para a pessoa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro:
              codigo: DADOS_INVALIDOS
              mensagem: Alguns dados precisam de ajuste. Confira os campos indicados e tente de novo.
              detalhes:
                - campo: cpf
                  mensagem: Falta 1 número. Confira no seu documento e digite os 11 números.
                - campo: email
                  mensagem: 'Falta o final do e-mail. Exemplo: ana@gmail.com'
              requestId: 3f1c2a9e-0b7d-4c55-9a51-2f7d8e6b1c40
    NaoAutenticado:
      description: Sem token, token inválido, expirado, revogado ou de conta desativada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro:
              codigo: NAO_AUTENTICADO
              mensagem: Entre na sua conta para continuar.
              detalhes: null
              requestId: 3f1c2a9e-0b7d-4c55-9a51-2f7d8e6b1c40
    NaoEncontrado:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro:
              codigo: NAO_ENCONTRADO
              mensagem:
                Não encontramos os dados da sua conta. Saia e entre de novo; se continuar, fale
                com a recepção.
              detalhes: null
              requestId: 3f1c2a9e-0b7d-4c55-9a51-2f7d8e6b1c40
    LimiteExcedido:
      description: Muitas requisições do mesmo IP. Veja os cabeçalhos RateLimit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro:
              codigo: LIMITE_EXCEDIDO
              mensagem: Foram muitas tentativas seguidas. Espere alguns minutos e tente de novo.
              detalhes: null
              requestId: 3f1c2a9e-0b7d-4c55-9a51-2f7d8e6b1c40
    ErroInterno:
      description: Erro inesperado. A causa fica só no log, com o mesmo requestId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro:
              codigo: ERRO_INTERNO
              mensagem: Algo não funcionou do nosso lado. Tente de novo em alguns minutos.
              detalhes: null
              requestId: 3f1c2a9e-0b7d-4c55-9a51-2f7d8e6b1c40
    IaIndisponivel:
      description: IA fora do ar (IA_INDISPONIVEL)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
  schemas:
    Perfil:
      type: string
      enum:
        - paciente
        - recepcionista
        - medico
        - manutencao
        - administrativo
    Preferencias:
      type: object
      additionalProperties: false
      required:
        - letraGrande
        - altoContraste
        - lembreteWhatsapp
      properties:
        letraGrande:
          type: boolean
        altoContraste:
          type: boolean
        lembreteWhatsapp:
          type: boolean
    Cadastro:
      type: object
      additionalProperties: false
      required:
        - nome
        - cpf
        - dataNascimento
        - telefone
        - email
        - senha
        - consentimento
      properties:
        nome:
          type: string
          maxLength: 120
          description: Nome e sobrenome, como no documento.
        cpf:
          type: string
          description: Com ou sem máscara; gravado só com os 11 dígitos.
        dataNascimento:
          type: string
          format: date
          description: AAAA-MM-DD
        telefone:
          type: string
          description: Com DDD, com ou sem máscara; gravado em E.164 sem o "+".
        email:
          type: string
          format: email
        senha:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
        sexo:
          $ref: '#/components/schemas/Sexo'
        consentimento:
          type: object
          additionalProperties: false
          required:
            - versaoTermo
            - aceito
            - exibicaoPainel
          properties:
            versaoTermo:
              type: string
              description: Precisa ser a versão vigente do termo.
            aceito:
              type: boolean
              const: true
            canal:
              type: string
              enum:
                - app
                - pwa
              default: app
            exibicaoPainel:
              type: boolean
              description:
                Aceite específico para exibir e anunciar o nome completo no painel de TV da
                recepção.
    Sexo:
      type: string
      enum:
        - feminino
        - masculino
        - outro
        - prefiro_nao_informar
    ContaCriada:
      type: object
      required:
        - id
        - nome
        - perfil
        - status
      properties:
        id:
          type: string
        nome:
          type: string
        perfil:
          $ref: '#/components/schemas/Perfil'
        status:
          type: string
          enum:
            - ativo
            - pre_cadastro
            - inativo
    AtualizarMe:
      type: object
      additionalProperties: false
      required:
        - nome
        - preferencias
      properties:
        nome:
          type: string
        telefone:
          type: string
        dataNascimento:
          type: string
          format: date
        sexo:
          $ref: '#/components/schemas/Sexo'
        preferencias:
          $ref: '#/components/schemas/Preferencias'
        consentimento:
          type: object
          additionalProperties: false
          required:
            - exibicaoPainel
          properties:
            exibicaoPainel:
              type: boolean
    Usuario:
      type: object
      required:
        - id
        - nome
        - email
        - cpf
        - perfil
        - preferencias
        - consentimento
        - status
        - criadoEm
        - atualizadoEm
      properties:
        id:
          type: string
        nome:
          type: string
        email:
          type: string
          format: email
        cpf:
          type: string
          pattern: ^\d{11}$
        telefone:
          type:
            - string
            - 'null'
          description: E.164 sem o "+"
        dataNascimento:
          type:
            - string
            - 'null'
          format: date
        sexo:
          oneOf:
            - $ref: '#/components/schemas/Sexo'
            - type: 'null'
        perfil:
          $ref: '#/components/schemas/Perfil'
        unidadeId:
          type:
            - string
            - 'null'
        unidadeIds:
          type: array
          items:
            type: string
        preferencias:
          $ref: '#/components/schemas/Preferencias'
        consentimento:
          type: object
          required:
            - versaoTermo
            - aceitoEm
            - canal
            - exibicaoPainel
          properties:
            versaoTermo:
              type: string
            aceitoEm:
              type: string
              format: date-time
            canal:
              type: string
              enum:
                - app
                - pwa
                - recepcao
                - seed
            exibicaoPainel:
              type: boolean
        status:
          type: string
          enum:
            - ativo
            - pre_cadastro
            - inativo
        criadoEm:
          type: string
          format: date-time
          description: ISO 8601 com offset -03:00
        atualizadoEm:
          type: string
          format: date-time
    Especialidade:
      type: object
      required:
        - id
        - nome
        - descricao
        - palavrasChave
        - ativa
        - criadoEm
        - atualizadoEm
      properties:
        id:
          type: string
          description: Igual ao nome do ícone no app (cardiologia, clinicoGeral…).
        nome:
          type: string
        descricao:
          type: string
        palavrasChave:
          type: array
          items:
            type: string
        ativa:
          type: boolean
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time
    CriarEspecialidade:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CamposEspecialidade'
    CamposEspecialidade:
      type: object
      required:
        - nome
        - descricao
      properties:
        nome:
          type: string
          minLength: 3
          maxLength: 60
        descricao:
          type: string
          minLength: 10
          maxLength: 300
        palavrasChave:
          type: array
          maxItems: 30
          items:
            type: string
    AtualizarEspecialidade:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CamposEspecialidade'
        - type: object
          required:
            - palavrasChave
            - ativa
          properties:
            ativa:
              type: boolean
    Endereco:
      type: object
      additionalProperties: false
      required:
        - logradouro
        - numero
        - bairro
        - cidade
        - uf
        - cep
      properties:
        logradouro:
          type: string
        numero:
          type: string
        bairro:
          type: string
        cidade:
          type: string
        uf:
          type: string
          minLength: 2
          maxLength: 2
        cep:
          type: string
          description: Com ou sem máscara; gravado com 8 dígitos.
    Unidade:
      type: object
      required:
        - id
        - nome
        - tipo
        - cnpj
        - endereco
        - bairroBusca
        - telefone
        - especialidadeIds
        - ativa
      properties:
        id:
          type: string
        nome:
          type: string
        tipo:
          type: string
          enum:
            - hospital
            - clinica
        cnpj:
          type: string
          pattern: ^\d{14}$
        endereco:
          $ref: '#/components/schemas/Endereco'
        bairroBusca:
          type: string
          description: Bairro em minúsculo e sem acento, gerado pela API.
        telefone:
          type: string
          description: E.164 sem o "+"
        especialidadeIds:
          type: array
          items:
            type: string
        ativa:
          type: boolean
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time
    CriarUnidade:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CamposUnidade'
    CamposUnidade:
      type: object
      required:
        - nome
        - tipo
        - cnpj
        - endereco
        - telefone
        - especialidadeIds
      properties:
        nome:
          type: string
        tipo:
          type: string
          enum:
            - hospital
            - clinica
        cnpj:
          type: string
          description: Com ou sem máscara.
        endereco:
          $ref: '#/components/schemas/Endereco'
        telefone:
          type: string
        especialidadeIds:
          type: array
          minItems: 1
          items:
            type: string
    AtualizarUnidade:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CamposUnidade'
        - type: object
          required:
            - ativa
          properties:
            ativa:
              type: boolean
    Conselho:
      type: object
      additionalProperties: false
      required:
        - tipo
        - numero
        - uf
      properties:
        tipo:
          type: string
          const: CRM
        numero:
          type: string
          description: Só dígitos; zeros à esquerda são removidos.
        uf:
          type: string
    Medico:
      type: object
      required:
        - id
        - nome
        - conselho
        - especialidadeIds
        - unidadeIds
        - ativo
      properties:
        id:
          type: string
        nome:
          type: string
          description: Com "Dr." ou "Dra."
        conselho:
          $ref: '#/components/schemas/Conselho'
        especialidadeIds:
          type: array
          items:
            type: string
        unidadeIds:
          type: array
          items:
            type: string
        ativo:
          type: boolean
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time
    MedicoCompleto:
      allOf:
        - $ref: '#/components/schemas/Medico'
        - type: object
          required:
            - usuarioId
            - criadoPorAdministrativo
          properties:
            usuarioId:
              type:
                - string
                - 'null'
            criadoPorAdministrativo:
              type: string
    CriarMedico:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CamposMedico'
    CamposMedico:
      type: object
      required:
        - nome
        - conselho
        - especialidadeIds
        - unidadeIds
      properties:
        nome:
          type: string
        conselho:
          $ref: '#/components/schemas/Conselho'
        especialidadeIds:
          type: array
          minItems: 1
          items:
            type: string
        unidadeIds:
          type: array
          minItems: 1
          items:
            type: string
        usuarioId:
          type:
            - string
            - 'null'
          description: Conta do médico no app (perfil medico), se já existir.
    AtualizarMedico:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CamposMedico'
        - type: object
          required:
            - ativo
          properties:
            ativo:
              type: boolean
    Saude:
      type: object
      required:
        - status
        - versao
        - em
      properties:
        status:
          type: string
          const: ok
        versao:
          type: string
          description: Versão da API (package.json)
        em:
          type: string
          format: date-time
          description: Momento da resposta, em UTC
    Erro:
      type: object
      required:
        - erro
      properties:
        erro:
          type: object
          required:
            - codigo
            - mensagem
            - requestId
          properties:
            codigo:
              type: string
              enum:
                - DADOS_INVALIDOS
                - NAO_AUTENTICADO
                - ACESSO_NEGADO
                - FORA_DA_UNIDADE
                - NAO_ENCONTRADO
                - CPF_JA_CADASTRADO
                - EMAIL_JA_CADASTRADO
                - ESPECIALIDADE_JA_CADASTRADA
                - CNPJ_JA_CADASTRADO
                - CONSELHO_JA_CADASTRADO
                - ESPECIALIDADE_NAO_CADASTRADA
                - UNIDADE_NAO_CADASTRADA
                - MEDICO_NAO_CADASTRADO
                - MEDICO_INATIVO
                - USUARIO_NAO_E_MEDICO
                - LIMITE_EXCEDIDO
                - ERRO_INTERNO
            mensagem:
              type: string
              description: Texto para a pessoa, dizendo o que fazer.
            detalhes:
              description: Lista de {campo, mensagem} em erros de validação; null nos demais.
              oneOf:
                - type: 'null'
                - type: array
                  items:
                    type: object
                    required:
                      - campo
                      - mensagem
                    properties:
                      campo:
                        type: string
                      mensagem:
                        type: string
            requestId:
              type: string
security:
  - tokenFirebase: []
