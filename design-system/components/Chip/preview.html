<!-- @dsCard group="Formulários" height=260 width=880 subtitle="Chip de filtro (liga e desliga) e chip de especialidade" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Chip</title>
<style>
  .demo { padding: 24px; display: flex; flex-direction: column; gap: 16px; max-width: 820px; }
  .titulo { margin: 8px 0 0; font-size: 16px; line-height: 24px; font-weight: 700; color: var(--textoSecundario); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.SaudeNaPalma, h = React.createElement;
  function Filtros() {
    var st = React.useState('manha');
    var ops = [['todos', 'Todos os horários'], ['manha', 'Manhã'], ['tarde', 'Tarde'], ['hoje', 'Só hoje']];
    return h(S.GrupoChips, { rotulo: 'Filtrar horários' }, ops.map(function (o) {
      return h(S.Chip, { key: o[0], selecionado: st[0] === o[0], aoTocar: function () { st[1](o[0]); } }, o[1]);
    }).concat([h(S.Chip, { key: 'f', demonstrarEstado: 'foco' }, 'Perto de mim (foco)')]));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'demo' },
      h('p', { className: 'titulo' }, 'Filtro: o selecionado tem fundo cheio E sinal de visto'),
      h(Filtros),
      h('p', { className: 'titulo' }, 'Especialidade'),
      h(S.GrupoChips, { rotulo: 'Especialidades da consulta' },
        h(S.Chip, { tipo: 'especialidade', especialidade: 'cardiologia' }, 'Cardiologia'),
        h(S.Chip, { tipo: 'especialidade', especialidade: 'clinicoGeral' }, 'Clínico geral'),
        h(S.Chip, { tipo: 'especialidade', especialidade: 'ortopedia', aoTocar: function () {} }, 'Ortopedia'))))
</script>
</body>
</html>
