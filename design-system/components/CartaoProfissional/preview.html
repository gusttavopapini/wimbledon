<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cartão de profissional</title>
<style>
  .demo { padding: 24px; }
  .tela { width: 390px; box-sizing: border-box; padding: 24px; border-radius: 32px; background: var(--superficie); box-shadow: 0 0 0 2px var(--teal50); display: flex; flex-direction: column; gap: 12px; }
  .titulo { margin: 0 0 4px; font-size: var(--sp-fs-tituloSecao); line-height: var(--sp-lh-tituloSecao); font-weight: 700; color: var(--primariaEscura); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.SaudeNaPalma, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'demo' }, h('div', { className: 'tela' },
      h('h2', { className: 'titulo' }, 'Cardiologistas perto de você'),
      h(S.CartaoProfissional, { nome: 'Dr. Carlos Ribeiro', especialidade: 'Cardiologia', unidade: 'Unidade Ilha do Leite' }),
      h(S.CartaoProfissional, { nome: 'Dra. Juliana Goes', especialidade: 'Cardiologia', unidade: 'Unidade Derby', detalhe: 'Próximo horário: amanhã, às 8h', demonstrarEstado: 'foco' }),
      h(S.CartaoProfissional, { nome: 'Dr. Paulo Gomes', especialidade: 'Cardiologia', unidade: 'Unidade Boa Vista' })))
  );
</script>
</body>
</html>
