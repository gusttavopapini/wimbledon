<!-- @dsCard group="Conteúdo" height=610 width=880 subtitle="Grade de 2 colunas e lista (automática no modo letra grande)" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cartão de especialidade</title>
<style>
  .demo { display: flex; gap: 32px; padding: 24px; align-items: flex-start; }
  .tela { width: 390px; box-sizing: border-box; padding: 24px; border-radius: 32px; background: var(--superficie); box-shadow: 0 0 0 2px var(--teal50); display: flex; flex-direction: column; gap: 16px; }
  .titulo { margin: 0; font-size: 16px; line-height: 24px; font-weight: 700; color: var(--textoSecundario); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.SaudeNaPalma, h = React.createElement;
  var ids = ['cardiologia', 'clinicoGeral', 'gastroenterologia', 'neurologia', 'ortopedia', 'ginecologia'];
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'demo' },
      h('div', { className: 'tela' },
        h('p', { className: 'titulo' }, 'Grade (padrão)'),
        h(S.GradeEspecialidades, null, ids.map(function (id, i) { return h(S.CartaoEspecialidade, { key: id, especialidade: id, demonstrarEstado: i === 2 ? 'foco' : undefined }); }))),
      h('div', { className: 'tela' },
        h('p', { className: 'titulo' }, 'Lista (letra grande ou fonte do sistema acima de 120%)'),
        h(S.GradeEspecialidades, { layout: 'lista' }, ['obstetricia', 'pneumologia', 'otorrinolaringologia', 'dermatologia'].map(function (id) { return h(S.CartaoEspecialidade, { key: id, especialidade: id, layout: 'lista' }); }))))
  );
</script>
</body>
</html>
