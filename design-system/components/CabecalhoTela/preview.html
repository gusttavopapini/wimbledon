<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cabeçalho de tela</title>
<style>
  .demo { display: flex; gap: 32px; padding: 24px; align-items: flex-start; }
  .tela { width: 390px; box-sizing: border-box; padding: 24px; border-radius: 32px; background: var(--superficie); box-shadow: 0 0 0 2px var(--teal50); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.SaudeNaPalma, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'demo' },
      h('div', { className: 'tela' }, h(S.CabecalhoTela, { titulo: 'Cardiologia', subtitulo: 'Escolha um médico perto de você.', aoVoltar: function () {} })),
      h('div', { className: 'tela' }, h(S.CabecalhoTela, { titulo: 'Minhas consultas', rotuloVoltar: 'Voltar ao início', aoVoltar: function () {}, demonstrarEstado: 'foco' })))
  );
</script>
</body>
</html>
