<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Navegação inferior</title>
<style>
  .demo { display: flex; gap: 32px; padding: 24px; align-items: flex-start; }
  .tela { width: 390px; box-sizing: border-box; padding: 0 8px 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.SaudeNaPalma, h = React.createElement;
  function Nav(p) { var st = React.useState(p.inicial); return h(S.NavegacaoInferior, { ativo: st[0], aoNavegar: st[1] }); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'demo' },
      h('div', { className: 'tela' }, h(Nav, { inicial: 'inicio' })),
      h('div', { className: 'tela' }, h(Nav, { inicial: 'consultas' })))
  );
</script>
</body>
</html>
